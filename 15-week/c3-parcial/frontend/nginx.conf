server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Proxy inverso: el navegador llama a /api en el MISMO origen que el frontend
    # y nginx lo reenvía al contenedor "api". Al no haber petición cross-origin,
    # en producción no se necesita CORS.
    location /api/ {
        proxy_pass http://api:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Archivos con hash en el nombre: se pueden cachear por mucho tiempo.
    location ~* \.(js|css|ico|png|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA: cualquier ruta de Angular (/citas/mias, /login...) devuelve index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
