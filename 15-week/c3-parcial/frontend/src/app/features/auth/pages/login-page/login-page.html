<section class="login">
  <form class="card" [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <h1>CitasMed</h1>
    <p class="muted">Ingresa para gestionar tus citas médicas</p>

    @if (expired()) {
      <div class="alert alert-info">Tu sesión expiró. Vuelve a iniciar sesión.</div>
    }

    @if (error(); as message) {
      <app-error-alert [message]="message" />
    }

    <label class="field">
      <span>Email</span>
      <input type="email" formControlName="email" autocomplete="username" />
      @if (form.controls.email.touched && form.controls.email.invalid) {
        <small class="error-text">Ingresa un email válido.</small>
      }
    </label>

    <label class="field">
      <span>Contraseña</span>
      <input type="password" formControlName="password" autocomplete="current-password" />
      @if (form.controls.password.touched && form.controls.password.invalid) {
        <small class="error-text">La contraseña es obligatoria.</small>
      }
    </label>

    <button type="submit" class="btn btn-primary btn-block" [disabled]="loading()">
      {{ loading() ? 'Ingresando...' : 'Ingresar' }}
    </button>
  </form>
</section>
