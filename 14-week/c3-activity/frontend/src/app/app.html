<header class="bg-dark text-white py-3 mb-4">
  <div class="container d-flex justify-content-between align-items-center">
    <h1 class="h4 m-0">Gestor de Tareas</h1>
    @if (auth.isLoggedIn()) {
      <div class="d-flex align-items-center gap-3">
        <span class="small">Sesión: {{ auth.username() }}</span>
        <button type="button" class="btn btn-sm btn-outline-light" (click)="logout()">Salir</button>
      </div>
    }
  </div>
</header>

<main class="container">
  <router-outlet />
</main>

<footer class="text-center text-muted py-4 mt-5">
  <small>Corte 3 — App fullstack segura (JWT) · .NET + Angular</small>
</footer>
