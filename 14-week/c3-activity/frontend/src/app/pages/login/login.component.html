<div class="row justify-content-center">
  <div class="col-12 col-md-6 col-lg-4">
    <div class="card shadow-sm">
      <div class="card-body">
        <h2 class="h5 mb-3">Iniciar sesión</h2>

        <form (ngSubmit)="submit()" novalidate>
          <div class="mb-3">
            <label for="username" class="form-label">Usuario</label>
            <input id="username" name="username" class="form-control" autocomplete="username"
                   [(ngModel)]="username" />
          </div>
          <div class="mb-3">
            <label for="password" class="form-label">Contraseña</label>
            <input id="password" name="password" type="password" class="form-control"
                   autocomplete="current-password" [(ngModel)]="password" />
          </div>

          @if (error()) {
            <div class="alert alert-danger py-2" role="alert" data-testid="login-error">{{ error() }}</div>
          }

          <button type="submit" class="btn btn-primary w-100" [disabled]="loading()">
            {{ loading() ? 'Entrando...' : 'Entrar' }}
          </button>
        </form>
      </div>
    </div>
  </div>
</div>
